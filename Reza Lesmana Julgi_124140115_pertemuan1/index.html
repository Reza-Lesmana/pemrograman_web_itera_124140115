<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasir Mini POS</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>Kasir Mini POS</h1>



<h2>Input Barang</h2>


<div class="form">


<label>
Nama Barang
</label>

<input 
type="text" 
id="namaBarang"
placeholder="Masukkan nama barang">


<label>
Harga Satuan
</label>

<input 
type="number"
id="harga"
placeholder="Masukkan harga">


<label>
Jumlah Barang
</label>

<input 
type="number"
id="qty"
placeholder="Masukkan jumlah">



<button onclick="tambahBarang()">
Tambah Barang
</button>


</div>




<h2>Keranjang Belanja</h2>


<table>


<thead>

<tr>

<th>No</th>

<th>Nama Barang</th>

<th>Harga</th>

<th>Qty</th>

<th>Subtotal</th>

<th>Aksi</th>


</tr>

</thead>



<tbody id="tabelBarang">


</tbody>


</table>




<div class="total">


<h3>
Total Belanja :
Rp <span id="total">0</span>
</h3>


<label>
Diskon (%)
</label>


<input 
type="number"
id="diskon"
value="0">



<label>
Uang Bayar
</label>


<input 
type="number"
id="bayar">



<button onclick="hitungKembalian()">

Hitung Kembalian

</button>



<h3>

Uang Kembali :

Rp <span id="kembali">0</span>

</h3>



<button 
class="reset"
onclick="resetTransaksi()">

Transaksi Baru

</button>



</div>


</div>




<script src="script.js"></script>


</body>

</html>
